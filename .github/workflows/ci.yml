name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # package.json pins packageManager, so the explicit corepack call always
      # resolves the same pnpm the local runs use.
      - run: corepack enable
      - run: corepack pnpm install --no-frozen-lockfile
      - run: corepack pnpm run typecheck
      - run: corepack pnpm run build
      # The runner image does not always ship ffmpeg; install it so the local
      # video-editing suite runs for real instead of skipping.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # One runner for every suite. Suites that need a live GenBox are reported
      # as SKIP; everything else runs against the build output.
      - run: node scripts/verify-all.mjs
