name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      # GenBox-independent checks. The runners ship ffmpeg, so the local video
      # editor and the annotation renderer are verified on every push.
      - run: node scripts/verify-annotate.mjs
      - run: node scripts/verify-video-edit.mjs
